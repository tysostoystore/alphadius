name: Daily Data Ingestion

on:
  schedule:
    # Runs every day at 03:00 UTC - avoid the top-of-hour queue spike
    - cron: '0 3 * * *'
  # Allows manual triggering from the GitHub UI Actions tab
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the updated database back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun (for fast install)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # better-sqlite3 is a Node.js native addon — must run ingest with Node, not Bun
      - name: Run data ingestion script (Node.js + tsx)
        run: npx --yes tsx scripts/ingest.ts

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add audius_alpha.db
          # Only commit if the database file actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily database update [skip ci]" && git push)
